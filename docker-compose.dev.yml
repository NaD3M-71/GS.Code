services:
  db:
    image: mysql:8.4
    container_name: gscode-db-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev
      MYSQL_DATABASE: gscode
      MYSQL_USER: gscode
      MYSQL_PASSWORD: gscode_dev
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  db_data:
